version: '3.4'

services:
  diwalisalesanalysispython:
    image: diwalisalesanalysispython
    build:
      context: .
      dockerfile: ./Dockerfile
    command: ["sh", "-c", "pip install debugpy -t /tmp && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 .conda\Lib\tkinter\test\test_tkinter\test_images.py "]
    ports:
      - 5678:5678
